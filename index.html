        /* ==========================================================================
        Popup Modal
        ========================================================================== */

        .popup-overlay {
            background-image: url(./assets/img/tvc/bg_video-section.png);
            background-size: cover;
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.1);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                        visibility 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .popup-overlay.show {
            opacity: 1;
            visibility: visible;
            animation: popupFadeIn 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        .popup-overlay.hide {
            opacity: 0;
            visibility: hidden;
            animation: popupFadeOut 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        .popup-content {
            position: relative;
            width: 90%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            overflow: visible;
        }

        .popup-close {
            position: absolute;
            top: -30px;
            right: -30px;
            width: 65px;
            height: 65px;
            background: url('./assets/img/icon/popup_close_btn.svg');
            background-size: cover;
            background-position: center;
            border: none;
            cursor: pointer;
            z-index: 10001;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .popup-close:hover {
            filter: brightness(1.1);
            transform: scale(1.05);
        }

        .popup-close svg {
            display: none;
        }

        @keyframes popupFadeIn {
            0%   { opacity: 0; transform: translate(0, 0) scale(0.8); }
            100% { opacity: 1; transform: translate(0, 0) scale(1); }
        }

        @keyframes popupFadeOut {
            0%   { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(0, 0) scale(0.8); }
        }

        .tvc-btn {

            height: auto;
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
        }

        .tvc-btn:hover {

        }

        /* 預設圖與 Hover 圖重疊定位 */
        .tvc-btn img {
            width: 100%;
            height: auto;
            display: block;
            transition: opacity 0.3s ease-in-out;
        }

        .tvc-btn img.btn-hover {

            top: 0;

    <script>


        // =====================================================
        //  區塊 1：開關邏輯
        // =====================================================
        document.addEventListener('DOMContentLoaded', () => {


            // =====================================================
            // 影片靜音、自動播放與暫停
            // =====================================================

            // 確保所有影片靜音（部分瀏覽器須以 JS 設定才生效）
            document.querySelectorAll('video').forEach(v => { v.muted = true; });
            // 滾動時影片自動暫停與恢復播放
            const allVideos = document.querySelectorAll('video');
            if (allVideos.length > 0) {
                const videoObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        const video = entry.target;
                        if (entry.isIntersecting) {
                            if (video.dataset.src && !video.src) {
                                video.src = video.dataset.src;
                                video.load();
                            }
                            if (document.visibilityState === 'visible') {
                                video.play().catch(() => {});
                            }
                        } else {
                            if (!video.paused) {
                                video.pause();
                            }
                        }
                    });
                }, { threshold: 0.1 });

                allVideos.forEach(video => videoObserver.observe(video));

                // 頁面切換 / 離開視窗自動暫停與恢復
                document.addEventListener('visibilitychange', () => {
                    allVideos.forEach(video => {
                        if (document.hidden) {
                            if (!video.paused) video.pause();
                        } else {
                            const rect = video.getBoundingClientRect();
                            const inView = rect.top < window.innerHeight && rect.bottom > 0 && rect.left < window.innerWidth && rect.right > 0;
                            if (inView) {
                                if (video.dataset.src && !video.src) {
                                    video.src = video.dataset.src;
                                    video.load();
                                }
                                video.play().catch(() => {});
                            }
                        }
                    });
                });

                window.addEventListener('pagehide', () => {
                    allVideos.forEach(video => { if (!video.paused) video.pause(); });
                });
            }


            // =====================================================
            // 手機選單開關
            // =====================================================
            const toggleBtn    = document.getElementById('mobile-menu');
            const dropdownMenu = document.getElementById('mobile-dropdown-menu');
           
            const menuLinks    = document.querySelectorAll('.mobile-menu-link');

            if (!toggleBtn || !dropdownMenu) return;

            toggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                dropdownMenu.classList.toggle('hidden');
            });

            menuLinks.forEach(link => {
                link.addEventListener('click', () => {
                    dropdownMenu.classList.add('hidden');
                });
            });

            document.addEventListener('click', (e) => {
                const isMenuOpen     = !dropdownMenu.classList.contains('hidden');
                const clickedOutside = !toggleBtn.contains(e.target) && !dropdownMenu.contains(e.target);
                if (isMenuOpen && clickedOutside) {
                    dropdownMenu.classList.add('hidden');
                }
            });


            // =====================================================
            // 側邊按鈕滾動顯示/隱藏 (淡入淡出)
            // =====================================================
            const sideBtn = document.getElementById('side-btn');
            const tvcSection = document.getElementById('tvc-section');

            if (sideBtn && tvcSection) {
                const toggleSideBtn = () => {
                    const rect = tvcSection.getBoundingClientRect();
                    if (rect.top <= window.innerHeight * 0.8) {
                        sideBtn.classList.add('show');
                    } else {
                        sideBtn.classList.remove('show');
                    }
                };

                window.addEventListener('scroll', toggleSideBtn, { passive: true });
                toggleSideBtn();
            }

        });


    </script>
