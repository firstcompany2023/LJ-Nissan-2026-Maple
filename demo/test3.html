<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日系秋日楓葉特效 - 優化版</title>
    <style>
        * { margin: 0; padding: 0; }
        body {
            background: #fffafa; 
            min-height: 100vh;
            cursor: url('images/cursor.png') 16 16, auto;
        }


        /* 飄落效果 */
        #falling-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 150%;
            pointer-events: none; 
            z-index: 9999;
            display: block;
        }


        /* Cursor動畫 */
        .click-ripple {
            position: fixed;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 999999;
            animation: rippleExpand 0.6s cubic-bezier(0.2, 0.8, 0.4, 1) forwards;
        }

        @keyframes rippleExpand {
            0% {
                transform: translate(-50%, -50%) scale(0.1);
                opacity: 0.85;
            }
            100% {
                transform: translate(-50%, -50%) scale(2.2);
                opacity: 0;
            }
        }



        /* Loading */
        #autumn-reveal-overlay {
            position: fixed;
            top: -20vh;
            left: -20vw;
            width: 140vw;
            height: 140vh;
            z-index: 999999;
            overflow: hidden;
            pointer-events: all;
            background-color: #ffffff;
            transition: background-color 1s ease, opacity 1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes floatBlob {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(18px, -15px) scale(1.04);
            }
        }

        .reveal-blob {
            position: absolute;
            border-radius: 50%;
            transform-origin: center center;
            animation: floatBlob 7s ease-in-out infinite;
            transition: transform 2.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 2.0s ease;
        }

        #reveal-logo {
            position: relative;
            z-index: 10;
            width: 180px;
            max-width: 35vw;
            height: auto;
            transition: transform 2.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 1.8s ease;
        }



        /* Demo 用的背景*/
        .page {
            background: url(images/demo1440.jpg) no-repeat center top / 100% auto;
            width: 100%;
            max-width: 1440px;
            padding-bottom: 291%;
            margin: auto;
        }
        @media (min-width: 1900px) {
            .page {
                background: url(images/demo1920.jpg) no-repeat center top / 100% auto;
                max-width: 1920px;
                padding-bottom: 218%;
            }
        }
        @media (max-width: 991px) {
            .page {
                background: url(images/demo991.jpg) no-repeat center top / 100% auto;
                max-width: 991px;
                padding-bottom: 472%;
            }
        }
        @media (max-width: 768px) {
            .page {
                background: url(images/demo393.jpg) no-repeat center top / 100% auto;
                max-width: 768px;
                padding-bottom: 975%;
            }
        }
    </style>
</head>
<body>
<div class="page"></div>
<canvas id="falling-canvas"></canvas>
<div id="autumn-reveal-overlay">
    <div id="reveal-logo">
        <svg width="130" height="109" viewBox="0 0 130 109" fill="none" xmlns="http://www.w3.org/2000/svg">

        </svg>
    </div>
</div>

<script>
const canvas = document.getElementById('falling-canvas');
const ctx = canvas.getContext('2d');

let width, height, dpr;
let petals = [];      
const petalCount = 9;
const imageUrls = [
    'images/maple/maple01.png', 'images/maple/maple02.png', 'images/maple/maple03.png', 'images/maple/maple04.png', 'images/maple/maple05.png',
    'images/maple/maple06.png', 'images/maple/maple07.png', 'images/maple/maple08.png', 'images/maple/maple09.png', 'images/maple/maple10.png',
    'images/maple/maple11.png', 'images/maple/maple12.png', 'images/maple/maple13.png', 'images/maple/maple14.png', 'images/maple/maple15.png',
    'images/maple/maple16.png', 'images/maple/maple17.png', 'images/maple/maple18.png', 'images/maple/maple19.png', 'images/maple/maple20.png'
];

const petalImages = imageUrls.map(src => {
    const img = new Image();
    img.src = src;
    return img;
});

// 擴充滑鼠物件以追蹤移動速度與方向向量
const mouse = { x: -1000, y: -1000, lastX: -1000, lastY: -1000, vx: 0, vy: 0, speed: 0 };

class Petal {
    constructor() {
        this.init(true);
    }

    init(isInitial = false) {
        this.x = Math.random() * (width * 1.3) - (width * 0.15);
        this.y = isInitial ? Math.random() * height : -Math.random() * 200 - 80;
        
        this.img = petalImages[Math.floor(Math.random() * petalImages.length)];
        
        // 楓葉大小（巨型約 130-160px，標準約 50-70px）
        const isGiant = Math.random() < 0.4; 
        if (isGiant) {
            this.size = Math.random() * 30 + 60; 
            this.blur = Math.random() * 6 + 4;   
            this.baseVy = Math.random() * 0.3 + 0.2; 
        } else {
            this.size = Math.random() * 20 + 20;  
            this.blur = Math.random() * 1.5 + 0.5;   
            this.baseVy = Math.random() * 0.6 + 0.4; 
        }
        
        this.vy = this.baseVy;
        this.opacity = Math.random() * 0.1 + 0.85; 
        this.rotation = Math.random() * Math.PI * 2;
        this.spin = (Math.random() - 0.5) * 0.02; 
        this.vx = (Math.random() - 0.5) * 0.2;
        this.offset = Math.random() * Math.PI * 2; 
    }

    update() {
        this.offset += 0.008;
        
        let targetVx = this.vx + Math.sin(this.offset) * 0.8;
        this.x += targetVx;
        this.y += this.vy;

        // 滑鼠劃過時：順著方向推開，並限制最大推力避免飛太快
        const dx = this.x - mouse.x;
        const dy = this.y - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        if (dist < 250 && mouse.speed > 0.5) {
            const force = (250 - dist) / 250;
            // 限制風力上限 (max: ±1.2)，確保滑鼠揮動再快也只有輕柔的風吹效果
            const windVx = Math.max(-1.2, Math.min(1.2, mouse.vx * 0.03));
            const windVy = Math.max(-1.2, Math.min(1.2, mouse.vy * 0.03));
            
            this.vx += windVx * force;
            this.vy += windVy * force;
        }

        // 速度阻尼：讓被風吹開的楓葉順暢滑行後，慢慢恢復原本的下落狀態
        this.vx *= 0.95;
        this.vy = this.vy * 0.95 + this.baseVy * 0.05;

        // 邊界檢查（寬高 +30%）
        const boundX = width * 0.15;
        if (this.y > height * 1.3 || this.x < -boundX || this.x > width + boundX) {
            this.init(false);
        }
        
        this.rotation += this.spin;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        
        ctx.globalAlpha = this.opacity;
        ctx.filter = `blur(${this.blur}px)`;

        if (this.img.complete && this.img.naturalWidth !== 0) {
            ctx.drawImage(this.img, -this.size/2, -this.size/2, this.size, this.size);
        } else {
            ctx.beginPath();
            ctx.ellipse(0, 0, this.size/2, this.size/2.5, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#D35400';
            ctx.fill();
        }
        ctx.restore();
    }
}

// 螢幕尺寸與 DPR 初始化
function resize() {
    dpr = window.devicePixelRatio || 1;
    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);

    // 初始化楓葉實例
    petals = [];
    for (let i = 0; i < petalCount; i++) {
        petals.push(new Petal());
    }
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
resize();

// 監聽滑鼠移動，即時計算移動速度 (Velocity)
window.addEventListener('mousemove', (e) => {
    mouse.lastX = mouse.x;
    mouse.lastY = mouse.y;
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    
    // 計算滑鼠移動的向量與速度
    mouse.vx = mouse.x - mouse.lastX;
    mouse.vy = mouse.y - mouse.lastY;
    mouse.speed = Math.sqrt(mouse.vx * mouse.vx + mouse.vy * mouse.vy);
});

// 動畫主循環
function animate() {
    ctx.clearRect(0, 0, width, height);

    // 每一幀讓滑鼠速度自然遞減衰減，確保滑鼠停下時風力消失
    mouse.speed *= 0.92;

    petals.forEach(p => {
        p.update();
        p.draw();
    });

    requestAnimationFrame(animate);
}

animate();



// Loading 動畫
document.addEventListener("DOMContentLoaded", () => {
    const overlay = document.getElementById('autumn-reveal-overlay');
    const colors = ['#FFFFFF', '#F2F4F7', '#E5E9F0', '#D0D6DC', '#A3ACB9'];

    const baseSize = Math.max(window.innerWidth, window.innerHeight) * 0.7;
    // 配合擴大的容器計算網格
    const cols = Math.ceil((window.innerWidth * 1.4) / (baseSize * 0.4)) + 1;
    const rows = Math.ceil((window.innerHeight * 1.4) / (baseSize * 0.4)) + 1;
    const blobs = [];

    for (let i = -1; i < rows; i++) {
        for (let j = -1; j < cols; j++) {
            const blob = document.createElement('div');
            blob.className = 'reveal-blob';

            const size = baseSize * (0.8 + Math.random() * 0.6);
            // 配合容器位移 (-20vw/-20vh) 補正座標
            const x = j * (baseSize * 0.4) - (size * 0.2) + (Math.random() * baseSize * 0.2);
            const y = i * (baseSize * 0.4) - (size * 0.2) + (Math.random() * baseSize * 0.2);
            
            const color = colors[Math.floor(Math.random() * colors.length)];

            blob.style.width = `${size}px`;
            blob.style.height = `${size}px`;
            blob.style.left = `${x}px`;
            blob.style.top = `${y}px`;
            
            blob.style.background = `radial-gradient(circle, ${color} 15%, ${color}00 75%)`;

            // 讓每個色塊的漂浮速度與起步時間不同，畫面更自然
            blob.style.animationDuration = `${6 + Math.random() * 4}s`;
            blob.style.animationDelay = `${Math.random() * -6}s`;

            overlay.appendChild(blob);
            blobs.push(blob);
        }
    }

    window.addEventListener('load', () => {
        overlay.style.backgroundColor = 'transparent';
        overlay.style.pointerEvents = 'none';

        // 頁面載入完成時，讓 Logo 與色塊「同時」開始慢慢淡出與微幅放大
        const logo = document.getElementById('reveal-logo');
        if (logo) {
            logo.style.transform = 'scale(1.12)'; 
            logo.style.opacity = '0';
        }

        blobs.sort(() => Math.random() - 0.5);

        // 移除過大的隨機亂數延遲，改用固定且緊湊的均勻間隔，避免少數色塊嚴重落後
        blobs.forEach((blob, idx) => {
            setTimeout(() => {
                blob.style.animation = 'none'; // 停止浮動動畫
                blob.style.transform = `scale(0)`; // 執行縮小淡出
                blob.style.opacity = '0';
            }, idx * 30); // 每個色塊接續淡出的時間差
        });

        // 總等待時間對應（ CSS 2.5s 動畫）
        const totalTime = blobs.length * 40 + 1500;
        setTimeout(() => {
            overlay.style.opacity = '0';
            setTimeout(() => overlay.remove(), 500);
        }, totalTime);
    });
});




// Cursor動畫
document.addEventListener('click', (e) => {
    const ripple = document.createElement('div');
    ripple.className = 'click-ripple';
    
    const size = 60;
    ripple.style.width = `${size}px`;
    ripple.style.height = `${size}px`;
    ripple.style.left = `${e.clientX}px`;
    ripple.style.top = `${e.clientY}px`;
    
    ripple.style.background = 'radial-gradient(circle, #D97245 0%, #C25F35 45%, rgba(181, 118, 51, 0) 75%)';

    document.body.appendChild(ripple);

    setTimeout(() => {
        ripple.remove();
    }, 600);
});

</script>

</body>
</html>
